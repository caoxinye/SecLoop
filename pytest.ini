# SPDX-License-Identifier: Apache-2.0
# Pytest configuration for the whole repository.
#
# NOTE: bytecode caching is disabled from conftest.py (see the comment there for
# the one residual pytest case that only PYTHONDONTWRITEBYTECODE=1 can prevent).
[pytest]
# Do not leave a .pytest_cache directory in the tree either.
addopts = -p no:cacheprovider
# A bare `pytest` collects both suites.  Neither needs the virtual machines, and
# the training tests are stdlib-only, so this works on a fresh checkout.
testpaths = tests
          training/tests
