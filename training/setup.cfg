# SPDX-License-Identifier: Apache-2.0
[isort]
default_section = FIRSTPARTY
ensure_newline_before_comments = True
force_grid_wrap = 0
include_trailing_comma = True
known_first_party = open_r1,agent
known_third_party =
    accelerate
    datasets
    deepspeed
    peft
    pytest
    requests
    torch
    transformers
    trl
line_length = 119
lines_after_imports = 2
multi_line_output = 3
use_parentheses = True

[flake8]
ignore = E203, E501, E741, W503, W605
max-line-length = 119
per-file-ignores =
    # re-export modules import after a sys.path shim, and package inits re-export names
    __init__.py: F401
    src/open_r1/utils/security_tools.py: E402, F401
    src/open_r1/utils/tool_manager.py: E402, F401
    src/open_r1/utils/batch_executor.py: E402, F401
    src/open_r1/grpo.py: E402

[tool:pytest]
testpaths = tests
doctest_optionflags = NUMBER NORMALIZE_WHITESPACE ELLIPSIS
# This file makes `training/` its own pytest rootdir, so the repository-level
# `pytest.ini` addopts do NOT apply to a run rooted here.  Repeat the
# cache-provider opt-out, otherwise `cd training && pytest` (or
# `pytest training/tests`) writes a `.pytest_cache` straight into the tree --
# which is exactly what the repository contract forbids.
addopts = -p no:cacheprovider
